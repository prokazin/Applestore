<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Админ-панель</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="adminApp">
        <div id="loginForm">
            <h2>Вход в админ-панель</h2>
            <input type="password" id="adminPassword" placeholder="Введите пароль">
            <button id="loginBtn">Войти</button>
        </div>

        <div id="adminPanel" style="display:none;">
            <header class="admin-header">
                <h1>Управление товарами</h1>
                <button id="logoutBtn">Выйти</button>
            </header>

            <!-- Форма добавления товара -->
            <div class="admin-form">
                <h3>Добавить товар</h3>
                <input type="text" id="productName" placeholder="Название">
                <input type="text" id="productPrice" placeholder="Цена">
                <textarea id="productDesc" placeholder="Описание"></textarea>
                <select id="productCategory">
                    <option value="iphone">iPhone</option>
                    <option value="ipad">iPad</option>
                    <option value="mac">Mac</option>
                    <option value="airpods">AirPods</option>
                </select>
                <input type="text" id="productImages" placeholder="URL фото (через запятую)">
                <div id="specsContainer">
                    <h4>Характеристики</h4>
                    <div class="spec-input">
                        <input type="text" class="spec-name" placeholder="Название характеристики">
                        <input type="text" class="spec-value" placeholder="Значение">
                        <button class="add-spec-btn">+</button>
                    </div>
                </div>
                <button id="addProductBtn">Добавить товар</button>
            </div>

            <!-- Список товаров для редактирования -->
            <div id="adminProductList"></div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
