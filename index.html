<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Apple Store</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://yookassa.ru/checkout-widget/v1/checkout-widget.js"></script>
</head>
<body>
    <!-- Загрузочный экран -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-content">
            <img src="loading.GIF" alt="Loading" class="loading-gif">
            <h2 class="loading-title">Apple Store</h2>
            <p class="loading-subtitle">Добро пожаловать!</p>
            <div class="loading-bar">
                <div class="loading-progress" id="loadingProgress"></div>
            </div>
        </div>
    </div>

    <!-- Видео фон -->
    <div class="video-background">
        <video autoplay muted loop playsinline id="bgVideo">
            <source src="bk.MP4" type="video/mp4">
        </video>
        <div class="video-overlay"></div>
    </div>

    <!-- Эмуляция экрана телефона -->
    <div class="phone-frame" id="phoneFrame">
        <div id="app">
            <!-- Динамический островок -->
            <div class="dynamic-island" id="dynamicIsland">
                <div class="island-content">
                    <span class="island-time" id="islandTime">9:41</span>
                    <div class="island-status">
                        <span class="island-dot"></span>
                        <span class="island-text">Apple Store</span>
                    </div>
                </div>
            </div>

            <!-- Верхняя панель -->
            <header class="header">
                <div class="header-left"></div>
                <div class="header-center"></div>
                <div class="header-actions">
                    <button class="cart-btn" id="cartBtn">
                        <span class="cart-icon">🛒</span>
                        <span class="cart-badge" id="cartBadge">0</span>
                    </button>
                </div>
            </header>

            <!-- Баннер акции -->
            <div class="promo-banner" id="promoBanner">
                <div class="promo-content">
                    <div class="promo-text">
                        <span class="promo-tag">🔥 HOT SALE</span>
                        <h3>Скидка до 30%</h3>
                        <p>на Apple Watch и AirPods</p>
                    </div>
                    <div class="promo-timer" id="promoTimer">
                        <span class="timer-label">До конца акции:</span>
                        <div class="timer-digits">
                            <span class="timer-unit" id="timerHours">12</span>
                            <span class="timer-sep">:</span>
                            <span class="timer-unit" id="timerMinutes">34</span>
                            <span class="timer-sep">:</span>
                            <span class="timer-unit" id="timerSeconds">56</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Каталог товаров -->
            <main class="catalog" id="catalog">
                <!-- Товары загружаются через JS -->
            </main>

            <!-- Нижняя навигация точь-в-точь как в Telegram -->
            <nav class="bottom-nav-telegram">
                <div class="tab-item active" data-category="watch">
                    <div class="tab-icon-wrapper">
                        <img src="apple.png" alt="Watch" class="tab-icon">
                    </div>
                    <span class="tab-label">Watch</span>
                </div>
                <div class="tab-item" data-category="iphone">
                    <div class="tab-icon-wrapper">
                        <img src="iphone.png" alt="iPhone" class="tab-icon">
                    </div>
                    <span class="tab-label">iPhone</span>
                </div>
                <div class="tab-item" data-category="mac">
                    <div class="tab-icon-wrapper">
                        <img src="computer.png" alt="Mac" class="tab-icon">
                    </div>
                    <span class="tab-label">Mac</span>
                </div>
                <div class="tab-item" data-category="airpods">
                    <div class="tab-icon-wrapper">
                        <img src="airpods.png" alt="AirPods" class="tab-icon">
                    </div>
                    <span class="tab-label">AirPods</span>
                </div>
            </nav>
        </div>
    </div>

    <!-- Модальное окно товара -->
    <div class="modal" id="productModal">
        <div class="modal-content glass-effect">
            <button class="close-modal">&times;</button>
            <div class="modal-carousel" id="modalCarousel"></div>
            <div class="modal-body">
                <h2 id="modalTitle"></h2>
                <p class="modal-price" id="modalPrice"></p>
                <p class="modal-description" id="modalDescription"></p>
                <div id="modalSpecs" class="specs"></div>
                <button class="buy-btn" id="modalBuyBtn">🛒 Добавить в корзину</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно корзины -->
    <div class="modal" id="cartModal">
        <div class="modal-content glass-effect cart-modal">
            <div class="cart-header">
                <h2>🛒 Корзина</h2>
                <button class="close-modal" id="closeCart">&times;</button>
            </div>
            <div class="cart-items" id="cartItems"></div>
            <div class="cart-comment">
                <textarea id="cartComment" placeholder="Добавьте комментарий к заказу..." rows="2"></textarea>
            </div>
            <div class="cart-footer">
                <div class="cart-total">
                    <span>Итого</span>
                    <span class="total-price" id="cartTotal">0 ₽</span>
                </div>
                <div class="cart-actions">
                    <button class="clear-cart-btn" id="clearCartBtn">🗑 Очистить</button>
                    <button class="checkout-btn" id="checkoutBtn">💳 Оплатить</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно оплаты -->
    <div class="modal" id="paymentModal">
        <div class="modal-content glass-effect payment-modal">
            <button class="close-modal" id="closePayment">&times;</button>
            <h2>💳 Оплата картой</h2>
            <div id="paymentDetails"></div>
            <div class="payment-form">
                <div class="form-group">
                    <label>Номер карты</label>
                    <input type="text" id="cardNumber" placeholder="0000 0000 0000 0000" maxlength="19">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Срок</label>
                        <input type="text" id="cardExpiry" placeholder="MM/YY" maxlength="5">
                    </div>
                    <div class="form-group">
                        <label>CVC</label>
                        <input type="password" id="cardCvc" placeholder="***" maxlength="3">
                    </div>
                </div>
                <div class="form-group">
                    <label>Имя владельца</label>
                    <input type="text" id="cardName" placeholder="IVAN IVANOV">
                </div>
            </div>
            <button class="confirm-payment-btn" id="confirmPaymentBtn">✅ Оплатить</button>
            <p class="secure-text">🔒 Безопасная оплата через YooKassa</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
